name: 🖥️ Temp VPS - SSH/RDP qua Tailscale

# ============================================================
# Workflow tạo VPS tạm thời qua GitHub Actions
# Hỗ trợ: Linux (SSH) | Windows (RDP) | macOS (SSH)
# Kết nối qua Tailscale VPN
# Thời gian chạy tối đa: 360 phút (6 tiếng)
# ============================================================

on:
  workflow_dispatch:
    inputs:
      os:
        description: '🖥️ Chọn hệ điều hành'
        required: true
        type: choice
        default: 'linux'
        options:
          - linux
          - windows
          - macos

      username:
        description: '👤 Tên người dùng (để trống sẽ dùng root)'
        required: false
        type: string
        default: 'root'

      password:
        description: '🔑 Mật khẩu đăng nhập SSH/RDP'
        required: true
        type: string
        default: 'P@ssw0rd123!'

      tailscale_auth_key:
        description: '🔐 Tailscale Auth Key (tạo tại: https://login.tailscale.com/admin/settings/keys)'
        required: true
        type: string

      tailscale_hostname:
        description: '🏷️ Hostname trên Tailscale (để trống sẽ tự sinh)'
        required: false
        type: string
        default: 'gh-temp-vps'

jobs:
  # ==========================================
  # LINUX VPS
  # ==========================================
  linux-vps:
    if: ${{ github.event.inputs.os == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📋 Hiển thị thông tin
        run: |
          echo "╔═══════════════════════════════════════╗"
          echo "║     🐧 LINUX VPS - GitHub Actions    ║"
          echo "╠═══════════════════════════════════════╣"
          echo "║ OS       : Ubuntu (ubuntu-latest)    ║"
          echo "║ Username : ${{ github.event.inputs.username }}"
          echo "║ SSH Port : 22                        ║"
          echo "║ Max Time : 360 phút (6 tiếng)        ║"
          echo "╚═══════════════════════════════════════╝"

      - name: 🔧 Cấu hình SSH Server
        run: |
          # Đặt mật khẩu cho root hoặc user chỉ định
          USERNAME="${{ github.event.inputs.username }}"
          PASSWORD="${{ github.event.inputs.password }}"

          if [ "$USERNAME" = "root" ]; then
            echo "root:$PASSWORD" | sudo chpasswd
          else
            sudo useradd -m -s /bin/bash "$USERNAME"
            echo "$USERNAME:$PASSWORD" | sudo chpasswd
            sudo usermod -aG sudo "$USERNAME"
            echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$USERNAME
          fi

          # Cấu hình SSH cho phép đăng nhập bằng password
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config

          # Khởi động lại SSH
          sudo systemctl restart sshd || sudo service ssh restart
          echo "✅ SSH Server đã sẵn sàng!"

      - name: 📦 Cài đặt Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale đã được cài đặt!"

      - name: 🔗 Kết nối Tailscale
        run: |
          HOSTNAME="${{ github.event.inputs.tailscale_hostname }}"
          if [ -z "$HOSTNAME" ]; then
            HOSTNAME="gh-linux-$(date +%s | tail -c 5)"
          fi

          sudo tailscale up \
            --authkey "${{ github.event.inputs.tailscale_auth_key }}" \
            --hostname "$HOSTNAME" \
            --accept-routes \
            --ssh

          # Lấy IP Tailscale
          sleep 5
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || ip addr show tailscale0 2>/dev/null | grep -oP 'inet \K[\d.]+' || echo "Đang chờ...")

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║         🟢 LINUX VPS ĐÃ SẴN SÀNG!                   ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Tailscale IP : $TAILSCALE_IP"
          echo "║  Hostname     : $HOSTNAME"
          echo "║  Username     : ${{ github.event.inputs.username }}"
          echo "║  Password     : ********"
          echo "║  SSH Command  : ssh ${{ github.event.inputs.username }}@$TAILSCALE_IP"
          echo "║  Hoặc         : ssh ${{ github.event.inputs.username }}@$HOSTNAME"
          echo "╚══════════════════════════════════════════════════════╝"

      - name: ⏳ Giữ VPS chạy (360 phút)
        run: |
          echo "🔄 VPS đang chạy... Thời gian tối đa: 360 phút"
          echo "📌 Để kết nối, dùng Tailscale IP ở trên"
          echo "🛑 Nhấn Cancel workflow để dừng sớm"
          for i in $(seq 1 21600); do
            sleep 10
            if [ $((i % 180)) -eq 0 ]; then
              echo "⏰ Đã chạy: $((i * 10 / 60)) phút / 360 phút"
            fi
          done

  # ==========================================
  # WINDOWS VPS
  # ==========================================
  windows-vps:
    if: ${{ github.event.inputs.os == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 📋 Hiển thị thông tin
        shell: pwsh
        run: |
          Write-Host "╔═══════════════════════════════════════╗"
          Write-Host "║   🪟 WINDOWS VPS - GitHub Actions    ║"
          Write-Host "╠═══════════════════════════════════════╣"
          Write-Host "║ OS       : Windows Server 2022       ║"
          Write-Host "║ Username : ${{ github.event.inputs.username }}"
          Write-Host "║ RDP Port : 3389                      ║"
          Write-Host "║ Max Time : 360 phút (6 tiếng)        ║"
          Write-Host "╚═══════════════════════════════════════╝"

      - name: 🔧 Cấu hình RDP và tạo User
        shell: pwsh
        run: |
          $username = "${{ github.event.inputs.username }}"
          $password = "${{ github.event.inputs.password }}"

          # Nếu user là root/Administrator thì dùng Administrator có sẵn
          if ($username -eq "root" -or $username -eq "Administrator" -or $username -eq "administrator") {
            $username = "Administrator"
            # Đổi mật khẩu Administrator
            net user Administrator $password
            Write-Host "✅ Đã đặt mật khẩu cho Administrator"
          } else {
            # Tạo user mới
            try {
              net user $username $password /add /fullname:"$username" /passwordchg:no 2>$null
              net localgroup "Administrators" $username /add
              net localgroup "Remote Desktop Users" $username /add
              Write-Host "✅ Đã tạo user: $username và thêm vào nhóm Administrators + Remote Desktop Users"
            } catch {
              Write-Host "⚠️ User có thể đã tồn tại, thử đổi mật khẩu..."
              net user $username $password
            }
          }

          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Cho phép RDP qua firewall
          netsh advfirewall firewall add rule name="RDP Port 3389" dir=in action=allow protocol=TCP localport=3389

          # Bật Network Level Authentication (tùy chọn - có thể tắt nếu cần)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Write-Host "✅ RDP đã được bật!"

      - name: 📦 Cài đặt Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
          Write-Host "✅ Tailscale đã được cài đặt!"

      - name: 🔗 Kết nối Tailscale
        shell: pwsh
        run: |
          $hostname = "${{ github.event.inputs.tailscale_hostname }}"
          if ([string]::IsNullOrEmpty($hostname)) {
            $hostname = "gh-win-$(Get-Random -Maximum 99999)"
          }

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey "${{ github.event.inputs.tailscale_auth_key }}" `
            --hostname "$hostname" `
            --accept-routes

          Start-Sleep -Seconds 8

          # Lấy IP Tailscale
          $tailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
          if (-not $tailscaleIP) { $tailscaleIP = "Đang lấy..." }

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════╗"
          Write-Host "║        🟢 WINDOWS VPS ĐÃ SẴN SÀNG!                  ║"
          Write-Host "╠══════════════════════════════════════════════════════╣"
          Write-Host "║  Tailscale IP : $tailscaleIP"
          Write-Host "║  Hostname     : $hostname"
          Write-Host "║  Username     : $username (từ bước trên)"
          Write-Host "║  Password     : ********"
          Write-Host "║  RDP Address  : $tailscaleIP`:3389"
          Write-Host "║  Hoặc         : $hostname`:3389"
          Write-Host "╚══════════════════════════════════════════════════════╝"

      - name: ⏳ Giữ VPS chạy (360 phút)
        shell: pwsh
        run: |
          Write-Host "🔄 VPS đang chạy... Thời gian tối đa: 360 phút"
          Write-Host "📌 Dùng Remote Desktop Connection để kết nối qua Tailscale IP"
          Write-Host "🛑 Nhấn Cancel workflow để dừng sớm"
          for ($i = 1; $i -le 21600; $i++) {
            Start-Sleep -Seconds 10
            if ($i % 180 -eq 0) {
              $minutes = [math]::Round($i * 10 / 60)
              Write-Host "⏰ Đã chạy: $minutes phút / 360 phút"
            }
          }

  # ==========================================
  # macOS VPS
  # ==========================================
  macos-vps:
    if: ${{ github.event.inputs.os == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 📋 Hiển thị thông tin
        run: |
          echo "╔═══════════════════════════════════════╗"
          echo "║    🍎 macOS VPS - GitHub Actions     ║"
          echo "╠═══════════════════════════════════════╣"
          echo "║ OS       : macOS (macos-latest)      ║"
          echo "║ Username : ${{ github.event.inputs.username }}"
          echo "║ SSH Port : 22                        ║"
          echo "║ Max Time : 360 phút (6 tiếng)        ║"
          echo "╚═══════════════════════════════════════╝"

      - name: 🔧 Cấu hình SSH Server
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          PASSWORD="${{ github.event.inputs.password }}"

          # Bật Remote Login (SSH)
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          if [ "$USERNAME" = "root" ]; then
            # Bật root user và đặt mật khẩu
            sudo dscl . -passwd /Users/root "$PASSWORD"
            sudo dscl . -create /Users/root UserShell /bin/bash
            echo "✅ Đã đặt mật khẩu cho root"
          else
            # Tạo user mới
            if ! id "$USERNAME" &>/dev/null; then
              sudo sysadminctl -addUser "$USERNAME" -fullName "$USERNAME" -password "$PASSWORD" -admin 2>/dev/null || {
                # Fallback: dùng dscl
                MAX_UID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)
                NEW_UID=$((MAX_UID + 1))
                sudo dscl . -create "/Users/$USERNAME"
                sudo dscl . -create "/Users/$USERNAME" UserShell /bin/bash
                sudo dscl . -create "/Users/$USERNAME" RealName "$USERNAME"
                sudo dscl . -create "/Users/$USERNAME" UniqueID "$NEW_UID"
                sudo dscl . -create "/Users/$USERNAME" PrimaryGroupID 20
                sudo dscl . -create "/Users/$USERNAME" NFSHomeDirectory "/Users/$USERNAME"
                sudo dscl . -passwd "/Users/$USERNAME" "$PASSWORD"
                sudo dscl . -append /Groups/admin GroupMembership "$USERNAME"
                sudo createhomedir -c -u "$USERNAME" 2>/dev/null || sudo mkdir -p "/Users/$USERNAME" && sudo chown -R "$NEW_UID:20" "/Users/$USERNAME"
              }
            else
              sudo dscl . -passwd "/Users/$USERNAME" "$PASSWORD"
            fi
            echo "✅ User $USERNAME đã sẵn sàng"
          fi

          # Cấu hình SSH cho phép password auth
          sudo sed -i '' 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          sudo sed -i '' 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo sed -i '' 's/^#*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || echo "ChallengeResponseAuthentication yes" | sudo tee -a /etc/ssh/sshd_config

          # Khởi động lại SSH
          sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist 2>/dev/null
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist
          echo "✅ SSH Server đã sẵn sàng!"

      - name: 📦 Cài đặt Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale đã được cài đặt!"

      - name: 🔗 Kết nối Tailscale
        run: |
          HOSTNAME="${{ github.event.inputs.tailscale_hostname }}"
          if [ -z "$HOSTNAME" ]; then
            HOSTNAME="gh-macos-$(date +%s | tail -c 5)"
          fi

          sudo tailscale up \
            --authkey "${{ github.event.inputs.tailscale_auth_key }}" \
            --hostname "$HOSTNAME" \
            --accept-routes \
            --ssh

          sleep 8
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || ifconfig utun* 2>/dev/null | grep -oP 'inet \K[\d.]+' | head -1 || echo "Đang chờ...")

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║         🟢 macOS VPS ĐÃ SẴN SÀNG!                   ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Tailscale IP : $TAILSCALE_IP"
          echo "║  Hostname     : $HOSTNAME"
          echo "║  Username     : ${{ github.event.inputs.username }}"
          echo "║  Password     : ********"
          echo "║  SSH Command  : ssh ${{ github.event.inputs.username }}@$TAILSCALE_IP"
          echo "║  Hoặc         : ssh ${{ github.event.inputs.username }}@$HOSTNAME"
          echo "╚══════════════════════════════════════════════════════╝"

      - name: ⏳ Giữ VPS chạy (360 phút)
        run: |
          echo "🔄 VPS đang chạy... Thời gian tối đa: 360 phút"
          echo "📌 Để kết nối, dùng Tailscale IP ở trên"
          echo "🛑 Nhấn Cancel workflow để dừng sớm"
          for i in $(seq 1 21600); do
            sleep 10
            if [ $((i % 180)) -eq 0 ]; then
              echo "⏰ Đã chạy: $((i * 10 / 60)) phút / 360 phút"
            fi
          done
